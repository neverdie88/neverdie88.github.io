<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body{% if page.layout == 'guide' %} class="guide-page"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="container" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.layout == 'guide' %}
      <script src="{{ '/assets/js/guide.js' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/mermaid.js' | relative_url }}" type="module"></script>
    {% endif %}
    {% if page.custom_js %}
      <script src="{{ page.custom_js | relative_url }}" type="module"></script>
    {% endif %}
  </body>
</html>

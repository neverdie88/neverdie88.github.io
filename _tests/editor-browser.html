<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitch control checks</title>
<style>body{margin:0;font:15px system-ui;background:#eee}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px}iframe{width:100%;height:calc(100vh - 110px);border:0}#status{margin:0 10px 8px}</style></head><body>
<header><button id="check" disabled>Check pitch controls</button><a href="composer-browser.html">Staff composer checks</a><button id="narrow">390 px view</button></header>
<p id="status" role="status">Loading. Synthetic microphone; no device access.</p><iframe id="app" title="Production app with synthetic microphone input" src="../pitch-visualizer/" allowfullscreen></iframe>
<script>
const frame=document.getElementById('app'),status=document.getElementById('status');
let win,doc,frequency=0,errors=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(value,message)=>{if(!value)throw Error(message);};
const $=id=>doc.getElementById('vp-'+id);
async function until(fn,message){const at=performance.now();while(!fn()){if(performance.now()-at>15000)throw Error(message);await sleep(40);}}
frame.addEventListener('load',()=>{
  win=frame.contentWindow;doc=win.document;
  const track={stop(){frequency=0;},addEventListener(){}};
  win.navigator.mediaDevices.getUserMedia=async()=>({getTracks:()=>[track],getAudioTracks:()=>[track]});
  win.AudioContext=class{state='running';sampleRate=48000;createMediaStreamSource(){return{connect(){},disconnect(){}};}createAnalyser(){return{disconnect(){},getFloatTimeDomainData(samples){for(let i=0;i<samples.length;i++)samples[i]=frequency?.3*Math.sin(2*Math.PI*frequency*i/48000):0;}};}close(){this.state='closed';}async resume(){this.state='running';}};
  win.addEventListener('error',event=>errors.push(event.message));
  win.addEventListener('unhandledrejection',event=>errors.push(String(event.reason)));
  document.getElementById('check').disabled=false;
  status.textContent='Ready. Uses the production controls, notation renderer and microphone loop.';
});
document.getElementById('check').onclick=async()=>{
  try {
    status.textContent='Checking…';
    $('clef').value='treble';$('clef').dispatchEvent(new win.Event('change'));
    $('trail-toggle').checked=true;$('trail-toggle').dispatchEvent(new win.Event('change'));
    if($('mic').textContent==='Start microphone')$('mic').click();
    await until(()=>$('mic').textContent==='Stop microphone','Microphone loop did not start');
    frequency=440;await until(()=>doc.querySelector('[data-note-label="current"]')?.textContent==='A4'&&doc.querySelector('[data-pitch-trace]'),'Note and trace missing');
    const staff=$('staff');
    staff.scrollIntoView({block:'center'});
    const beforeRedraw=staff.querySelector('.vp-staff-line');
    const targets=['.vp-staff-line','.vp-clef','.vp-note-glyph','.vp-live-dot'].map(selector=>{
      const box=staff.querySelector(selector).getBoundingClientRect();
      return {x:box.x+box.width/2,y:box.y+box.height/2};
    });
    const staffBox=staff.getBoundingClientRect();
    targets.push({x:staffBox.x+staffBox.width*.8,y:staffBox.y+staffBox.height*.5});
    const hitStaff=()=>targets.forEach(point=>check(doc.elementFromPoint(point.x,point.y)===staff,'Staff drawing intercepts pointer input during microphone updates'));
    hitStaff();
    await until(()=>!beforeRedraw.isConnected,'Staff did not redraw during the microphone test');
    hitStaff();
    for(let attempt=0;attempt<4;attempt++){
      staff.scrollIntoView({block:'center'});
      const expected=$('clef').value==='treble'?'bass':'treble';
      const line=staff.querySelector('.vp-staff-line'),box=line.getBoundingClientRect();
      const target=doc.elementFromPoint(box.x+box.width*.75,box.y);
      check(target===staff,'Staff line is not a stable click target');
      target.dispatchEvent(new win.MouseEvent('mousedown',{bubbles:true,button:0}));
      await until(()=>!line.isConnected,'No microphone redraw between mouse press and release');
      check(target.isConnected,'Microphone redraw removed the pressed element');
      target.dispatchEvent(new win.MouseEvent('mouseup',{bubbles:true,button:0}));
      target.dispatchEvent(new win.MouseEvent('click',{bubbles:true,button:0}));
      check($('clef').value===expected,'Staff click failed during microphone redraw');
      check($('mic').textContent==='Stop microphone','Staff switching interrupted the microphone');
    }
    $('trail-toggle').click();frequency=220;
    await until(()=>doc.querySelector('[data-note-label="current"]')?.textContent==='A3','Live note stopped with blue pitch lines off');
    check(!doc.querySelector('[data-pitch-trace]'),'Blue pitch lines off still draws a curve');
    $('staff').dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
    check($('clef').value==='bass','Tap did not switch to bass');
    $('staff').dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
    check($('clef').value==='treble','Keyboard did not switch to treble');
    $('trail-toggle').click();await until(()=>doc.querySelector('[data-pitch-trace]'),'Blue pitch lines did not reappear');
    check(!$('sheet-input')&&!$('score-open')&&!$('editor-dialog'),'Sheet controls remain in the pitch app');
    check(!$('mode-sheet')&&!$('follow-toggle'),'Practice mode remains');
    check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+1,'Page overflows horizontally');
    check(!errors.length,errors.join('; '));
    $('mic').click();
    status.textContent='PASS: blue pitch lines off/on, live notes, tap and keyboard staff switching, separate pitch-only UI, responsive layout; no practice mode or browser errors.';
  } catch(error) { frequency=0;status.textContent='FAIL: '+[error.message,...errors,$('score-error')?.textContent].filter(Boolean).join('; '); }
};
document.getElementById('narrow').onclick=()=>{frame.style.width=frame.style.width==='390px'?'100%':'390px';};
</script></body></html>

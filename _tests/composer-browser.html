<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engraved editor checks</title><style>body{margin:0;font:14px system-ui;background:#eee}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}#status{margin:0 10px 8px}iframe{width:100%;height:calc(100vh - 105px);border:0}</style></head><body>
<header><button id="test" disabled>Check engraving and editing</button><button id="listen" disabled>Check piano playback</button><button id="narrow">390 px view</button><a href="sheet-browser.html">Sheet checks</a></header><p id="status">Loading…</p><iframe id="app" title="Production sheet editor" src="../sheet-music/"></iframe>
<script>
const frame=document.getElementById('app'),status=document.getElementById('status');let win,doc,saved,errors=[],sounded=[];
const $=id=>doc.getElementById('vp-editor-'+id),check=(value,message)=>{if(!value)throw Error(message);};
async function until(fn,message){const start=performance.now();while(!fn()){if(performance.now()-start>60000)throw Error(message);await new Promise(r=>setTimeout(r,20));}}
const idle=()=>until(()=>$('canvas-scroll').getAttribute('aria-busy')!=='true','Engraving did not finish');
async function click(id){doc.getElementById('vp-'+id).click();await idle();}
async function key(key,mods={}){$('canvas').dispatchEvent(new win.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true,...mods}));await idle();}
async function change(id,value){$(id).value=String(value);$(id).dispatchEvent(new win.Event('change',{bubbles:true}));await idle();}
function position(measure,beat,step,staff='1'){
 const bar=$('canvas').querySelector(`[data-composer-measure="${measure}"][data-composer-staff="${staff}"]`);
 return {x:win.ScoreEngraver.xAt({points:JSON.parse(bar.dataset.beatPoints)},beat),y:+bar.dataset.bottom-step*+bar.dataset.halfGap};
}
async function pointer(type,p){const svg=$('canvas'),point=svg.createSVGPoint();point.x=p.x;point.y=p.y;const screen=point.matrixTransform(svg.getScreenCTM());svg.dispatchEvent(new win.PointerEvent(type,{bubbles:true,button:0,buttons:type==='pointerup'?0:1,pointerId:1,pointerType:'mouse',clientX:screen.x,clientY:screen.y}));await idle();}
async function run(action){try{status.textContent='Checking…';await action();check(!errors.length,errors.join('; '));}catch(error){status.textContent='FAIL: '+[error.message,...errors,$('error')?.textContent].filter(Boolean).join('; ');}}
frame.addEventListener('load',()=>{
 win=frame.contentWindow;doc=win.document;$('canvas').setPointerCapture=()=>{};
 win.addEventListener('error',e=>errors.push(e.message));win.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 const load=win.PianoSamples.load;win.PianoSamples.load=async(...args)=>{const instrument=await load(...args),play=instrument.play;instrument.play=(midi,...rest)=>{sounded.push(midi);return play(midi,...rest);};return instrument;};
 const make=win.URL.createObjectURL.bind(win.URL);win.URL.createObjectURL=blob=>{if(blob.type.includes('musicxml'))saved=blob;return make(blob);};
 const click=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){if(!this.download)return click.call(this);};
 document.getElementById('test').disabled=false;document.getElementById('listen').disabled=false;status.textContent='Ready. Checks use production OSMD, direct editing, MusicXML export and real piano audio.';
});
document.getElementById('test').onclick=()=>run(async()=>{
 if($('dialog').open)await click('editor-cancel');doc.getElementById('vp-score-template').value='piano';await click('score-new');
 check($('canvas').dataset.engraver==='osmd','Editor is not using OSMD');
 check($('canvas').querySelectorAll('[data-composer-measure]').length===16,'Piano staves or empty measures are missing');
 await key('n');await key('4');for(const note of ['c','d','e','f'])await key(note);
 check($('canvas').querySelector('.vf-beam'),'Eighth notes were not beamed');
 await key('G',{shiftKey:true});await key('Escape');
 await change('lane',1);await key('n');await key('5');await key('c');await key('Escape');
 const bass=$('canvas').querySelector('[data-composer-note][data-staff="2"][aria-label^="C3"]');
 check(bass,'Bass note was not entered');const p={x:+bass.dataset.x,y:+bass.dataset.y},up={x:p.x,y:p.y-5};
 await pointer('pointerdown',p);await pointer('pointermove',up);await pointer('pointerup',up);
 check($('canvas').querySelector('[data-composer-note][aria-label^="D3"]'),'Dragging missed the engraved bass note');
 await click('editor-undo');check($('canvas').querySelector('[data-composer-note][aria-label^="C3"]'),'Undo failed');
 await click('editor-redo');
 await click('editor-add-line');check($('measure').options.length===12,'Add line did not add four paired measures');
 await click('editor-undo');check($('measure').options.length===8,'Undo did not remove the whole line');await click('editor-redo');
 await change('lane',0);await change('measure',1);await change('clef','bass');await change('measure',2);await change('clef','treble');
 await change('title','Engraved piano test');await click('editor-apply');await until(()=>!$('dialog').open,'Apply failed');
 await click('score-save');const d=win.ScoreEditorModel.create(await saved.text());
 check(d.inspect().title==='Engraved piano test','Title was not exported');
 check(d.playback(0,'1','1').events.map(e=>e.midi).join(',')==='60,62,64,65,67','Treble notes/chord changed');
 check(d.playback(0,'2','2').events[0].midi===50,'Bass edit was not exported');
 check(d.context(0,1,'1',0).clef==='bass'&&d.context(0,2,'1',0).clef==='treble','Clef changes were not exported');
 await click('score-edit');check($('canvas').querySelector('[data-engraved-note]'),'Reopened score is missing notation');
 check($('dialog').scrollWidth<=$('dialog').clientWidth+1,'Dialog overflows');
 status.textContent='PASS: shared engraving, grand-staff lines, clef changes, keyboard input, beams, chords, bass drag, Undo/Redo, apply, export, reopen and dialog width.';
});
document.getElementById('listen').onclick=()=>run(async()=>{
 check($('dialog').open,'Run the engraving check first');await change('lane',0);await change('tempo',240);sounded=[];
 await click('editor-play');await until(()=>sounded.length>0,'No piano notes were scheduled');
 await until(()=>$('play').textContent.includes('Play'),'Preview did not finish');
 check(sounded.join(',')==='60,62,64,65,67','Preview played different notes: '+sounded);
 await click('editor-play');await click('editor-play');check($('play').textContent.includes('Play'),'Stop did not work');
 status.textContent='PASS: actual grand piano preview matches the engraved treble notes and Stop works.';
});
document.getElementById('narrow').onclick=()=>{frame.style.width=frame.style.width==='390px'?'100%':'390px';};
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano chord browser check</title>
<style>body{margin:0;font:15px system-ui;background:#eee}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:10px}iframe{width:100%;height:calc(100vh - 130px);border:0}#status{margin:0 12px 8px}</style></head><body>
<header><button id="test" disabled>Test simultaneous piano chords</button><button id="partial" disabled>Test missing chord tone</button><button id="finish" disabled>Complete chord</button><button id="narrow">Narrow view</button></header>
<p id="status" role="status">Loading recorded piano samples. No device access.</p><iframe id="app" title="Production app with recorded piano microphone input" src="../pitch-visualizer/"></iframe>
<script>
const frame=document.getElementById('app'),status=document.getElementById('status');
let win, notes=[],started=0, mutedAt=0, captured=[];
const recordings=new Map(), sources=[[48,'C3'],[60,'C4'],[63,'Ds4'],[66,'Fs4'],[69,'A4'],[72,'C5']];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(condition,message)=>{if(!condition)throw Error(message);};
const current=()=>frame.contentDocument.querySelector('[data-practice-event]');
const index=()=>Number(current()?.dataset.eventIndex);
async function waitFor(test,message){const start=performance.now();while(!test()){if(performance.now()-start>15000)throw Error(message);await sleep(40);}}
const play=midis=>{notes=midis;started=win.performance.now();mutedAt=0;};
const mute=()=>{mutedAt=win.performance.now();};
function sample(midi,time){
  const [base,name]=sources.reduce((best,s)=>Math.abs(s[0]-midi)<Math.abs(best[0]-midi)?s:best);
  const data=recordings.get(name),position=time*22050*2**((midi-base)/12),i=Math.floor(position);
  return i<0||i+1>=data.length?0:data[i]+(data[i+1]-data[i])*(position-i);
}
frame.addEventListener('load',async()=>{
  try{
    win=frame.contentWindow;
    for(const [,name] of sources){
      const response=await fetch('./fixtures/piano/'+name+'.wav');check(response.ok,'Piano recording missing');
      const data=new DataView(await response.arrayBuffer());let start=12;
      const tag=p=>String.fromCharCode(...Array.from({length:4},(_,i)=>data.getUint8(p+i)));
      while(tag(start)!=='data')start+=8+data.getUint32(start+4,true)+(data.getUint32(start+4,true)%2);
      const length=data.getUint32(start+4,true)/2;
      recordings.set(name,Float32Array.from({length},(_,i)=>data.getInt16(start+8+i*2,true)/32768));
    }
    const track={stop(){mute();},addEventListener(){}};
    win.navigator.mediaDevices.getUserMedia=async()=>({getTracks:()=>[track],getAudioTracks:()=>[track]});
    win.AudioContext=class{
      state='running';sampleRate=48000;
      createMediaStreamSource(){return{connect(){},disconnect(){}};}
      createAnalyser(){return{disconnect(){},getFloatTimeDomainData(samples){const now=win.performance.now();for(let i=0;i<samples.length;i++){const absolute=now-(samples.length-i)/48,time=(absolute-started)/1000;samples[i]=mutedAt&&absolute>=mutedAt?0:notes.reduce((sum,midi)=>sum+2*sample(midi,time)/Math.sqrt(notes.length),0);}}};}
      close(){this.state='closed';}async resume(){this.state='running';}
    };
    win.addEventListener('vp:chords',({detail})=>captured.push(...detail.frames));
    win.addEventListener('error',event=>{status.textContent='ERROR: '+event.message;});
    document.getElementById('test').disabled=false;document.getElementById('partial').disabled=false;
    status.textContent='Ready. Real piano recordings → microphone code → Basic Pitch WASM worker → practice staff.';
  }catch(error){status.textContent='FAIL: '+error.message;}
});
async function openSample(){
  const doc=frame.contentDocument;mute();captured=[];doc.getElementById('vp-score-sample').click();
  await waitFor(()=>current()&&index()===0,'Sample did not load');
  doc.getElementById('vp-follow-toggle').click();
  await waitFor(()=>doc.getElementById('vp-follow-toggle').textContent==='Pause practice','Practice did not start');
  play([69]);await waitFor(()=>index()===1,'A4 did not advance');play([71]);await waitFor(()=>index()===2,'B4 did not advance');
  return doc;
}
document.getElementById('test').onclick=async()=>{
  document.getElementById('test').disabled=true;
  try{
    status.textContent='Playing recorded piano notes and chords…';const doc=await openSample();
    play([72,76]);await waitFor(()=>index()===3,'Simultaneous C5/E5 did not complete');
    check(captured.some(f=>[72,76].every(m=>f.pitches.some(p=>p.midi===m))),'Two tones were never detected together');
    play([74]);await waitFor(()=>index()===4,'D5 did not advance');
    // The next chord repeats D5: release it before striking the chord again.
    mute();await sleep(400);
    play([67,71,74]);await waitFor(()=>index()===5,'Simultaneous G4/B4/D5 did not complete');mute();
    check(captured.some(f=>[67,71,74].every(m=>f.pitches.some(p=>p.midi===m))),'Three tones were never detected together');
    await sleep(320);check(!doc.querySelector('[data-event-index="4"]'),'Completed chord remains');
    const svg=doc.getElementById('vp-staff');check(Math.abs(Number(current().dataset.eventX)-svg.viewBox.baseVal.width/2)<1,'Next note is not centered');
    check(new Set([...doc.querySelectorAll('[data-trace-voice]')].map(p=>p.dataset.traceVoice)).size>=3,'Multiple pitch traces are missing');
    doc.getElementById('vp-follow-panel').scrollIntoView({block:'start'});
    status.textContent='PASS: two-note and three-note piano chords detected together; chords disappeared; next note centered; multiple traces visible.';
  }catch(error){status.textContent='FAIL: '+error.message;mute();}
  finally{document.getElementById('test').disabled=false;}
};
document.getElementById('partial').onclick=async()=>{
  try{
    status.textContent='Checking that one tone cannot complete a two-note chord…';const doc=await openSample();
    play([76]);await waitFor(()=>current()?.querySelector('[data-target-midi="76"][data-matched="true"]'),'E5 was not matched');mute();
    await sleep(400);check(index()===2,'One tone completed the whole chord');
    check(current().querySelector('[data-target-midi="72"][data-matched="false"]'),'Missing C5 was falsely matched');
    doc.getElementById('vp-follow-panel').scrollIntoView({block:'start'});document.getElementById('finish').disabled=false;
    status.textContent='PASS: E5 faded, C5 remains; missing tone did not complete the chord.';
  }catch(error){status.textContent='FAIL: '+error.message;mute();}
};
document.getElementById('finish').onclick=async()=>{
  try{play([72]);await waitFor(()=>index()===3,'C5 did not complete the partial chord');mute();status.textContent='PASS: sequential chord tones also work.';document.getElementById('finish').disabled=true;}
  catch(error){status.textContent='FAIL: '+error.message;mute();}
};
document.getElementById('narrow').onclick=()=>{frame.style.width=frame.style.width==='390px'?'100%':'390px';};
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Pitch Visualizer</title>
<link rel="stylesheet" href="../music-shared/base.css?v=02ece7fa7f18">
<link rel="stylesheet" href="../music-shared/fullscreen.css?v=4b95671cc0ad">
<link rel="stylesheet" href="./styles.css?v=23168c867206">

</head>
<body>
<main class="vp-page">
<header class="vp-heading"><h1>Pitch Visualizer</h1><p>See the notes you play. Stay in tune.</p></header>
<div id="violin-pitch" data-music-app>
  <div class="viz-controls" id="vp-notation-controls">
    <label class="form-label" for="vp-clef">Staff
      <select class="form-select" id="vp-clef">
        <option value="treble">G staff (treble)</option>
        <option value="bass">F staff (bass)</option>
      </select>
    </label>
    <label class="form-label" for="vp-key">Scale
      <select class="form-select" id="vp-key"></select>
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label" for="vp-a4">A4 tuning (Hz)
      <input class="form-control" id="vp-a4" type="number" min="400" max="480" step="0.1" value="440" inputmode="decimal" aria-describedby="vp-calibration-error" required>
    </label>
    <button class="btn btn-primary" id="vp-mic" type="button">Start microphone</button>
  </div>
  <p id="vp-calibration-error" class="text-destructive vp-detail" role="alert" hidden></p>
  <p id="vp-error" class="text-destructive vp-detail" role="alert" hidden></p>

  <div id="vp-practice" class="vp-practice">
    <div id="vp-live-panel" class="vp-live-panel">
      <div class="vp-section" id="vp-readout-panel">
        <div class="vp-readout vp-measure">
          <h1 id="vp-note">—</h1>
        </div>
      </div>

      <div class="vp-section" id="vp-live-sheet">
        <div class="vp-section-header">
          <div><span id="vp-staff-label">Live pitch</span> <span class="text-small text-muted" id="vp-score-caption">C major</span></div>
          <div class="vp-sheet-tools">
            <label class="vp-trail-toggle" for="vp-trail-toggle" title="Show or hide the blue pitch trace lines"><input id="vp-trail-toggle" type="checkbox" role="switch" checked> Blue pitch lines</label>
            <button class="btn btn-ghost vp-fullscreen-button" type="button" data-vp-fullscreen="vp-live-sheet" data-fullscreen-label="live pitch staff" aria-label="Enter fullscreen: live pitch staff" title="Enter fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="vp-expand-icon" d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><path class="vp-collapse-icon" d="M3 8h5V3M21 8h-5V3M8 21v-5H3M16 21v-5h5"/></svg></button>
          </div>
        </div>
        <svg id="vp-staff" class="vp-chart" height="328" role="button" tabindex="0" aria-describedby="vp-staff-hint" aria-label="Treble staff. Switch to bass staff."></svg>
        <p id="vp-staff-hint" class="text-small text-muted">Tap or click the staff to switch between treble and bass.</p>
      </div>
    </div>
  </div>

  <span class="sr-only" id="vp-announcement" role="status" aria-live="polite"></span>
</div>
<script src="../music-shared/pitch-core.js?v=38f34c86abf8"></script>
<script src="../music-shared/music-glyphs.js?v=c37aec90ce83"></script>
<script src="../music-shared/fullscreen.js?v=3c122736a629"></script>
<script src="./app.js?v=e50e4bbdd168"></script>
</main>
</body>
</html>
